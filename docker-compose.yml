services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus_etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5
    restart: unless-stopped

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - milvus_minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5
    restart: unless-stopped

  milvus-standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.8
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_REGION=us-east-1
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Hot reload: local code changes reflected in container
      - ./backend:/app/backend
      - ./ai:/app/ai
      # Persist SQLite database across restarts
      - session_data:/data
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - DB_PATH=/data/sessions.db
      - MILVUS_URI=${MILVUS_URI:-http://milvus-standalone:19530}
      - MILVUS_COLLECTION_NAME=${MILVUS_COLLECTION_NAME:-news_article_chunks}
      - MILVUS_INDEX_TYPE=${MILVUS_INDEX_TYPE:-HNSW}
      - MILVUS_INDEX_PARAMS=${MILVUS_INDEX_PARAMS:-}
      - MILVUS_SEARCH_PARAMS=${MILVUS_SEARCH_PARAMS:-}
      - RAG_TOP_K=${RAG_TOP_K:-3}
      - RAG_CANDIDATE_MULTIPLIER=${RAG_CANDIDATE_MULTIPLIER:-4}
      - RAG_CONTEXTUAL_WINDOW=${RAG_CONTEXTUAL_WINDOW:-1}
      - RAG_CONTEXTUAL_COMPRESSION_ENABLED=${RAG_CONTEXTUAL_COMPRESSION_ENABLED:-true}
      - RAG_COMPRESSION_SIMILARITY_THRESHOLD=${RAG_COMPRESSION_SIMILARITY_THRESHOLD:-0.2}
      - RAG_LLM_EXTRACTION_ENABLED=${RAG_LLM_EXTRACTION_ENABLED:-false}
      - VOYAGE_EMBEDDING_MODEL=${VOYAGE_EMBEDDING_MODEL:-voyage-4}
      - VOYAGE_EMBEDDING_DIMENSION=${VOYAGE_EMBEDDING_DIMENSION:-}
    env_file:
      - .env
    depends_on:
      milvus-standalone:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Hot reload: bind-mount source; preserve node_modules from container
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # Force file-system polling so inotify works inside Docker on Linux
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  startup-notifier:
    image: python:3.12-slim
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    command:
      [
        "python",
        "-c",
        "print('News Summarizer ready\\nFrontend: http://localhost:3000\\nBackend:  http://localhost:8000\\nHealth:   http://localhost:8000/health', flush=True)",
      ]
    restart: "no"

volumes:
  session_data:
  milvus_data:
  milvus_etcd:
  milvus_minio:
